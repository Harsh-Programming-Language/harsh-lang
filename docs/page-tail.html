<script>
(function(){
  var b=document.body, t=document.getElementById('nav-toggle');
  try{ if(localStorage.getItem('harsh-nav')==='hidden') b.classList.add('nav-hidden'); }catch(e){}
  t.addEventListener('click',function(){
    b.classList.toggle('nav-hidden');
    try{ localStorage.setItem('harsh-nav', b.classList.contains('nav-hidden')?'hidden':'shown'); }catch(e){}
  });
  // The back-to-top arrow: shown once the page has scrolled a screen or so.
  var up=document.createElement('button');
  up.className='to-top'; up.textContent='\u2191';
  up.title='Back to the top'; up.setAttribute('aria-label','Back to the top');
  up.addEventListener('click',function(){
    var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({top:0,behavior:still?'auto':'smooth'});
  });
  b.appendChild(up);
  var show=function(){ up.classList.toggle('shown', window.scrollY>400); };
  window.addEventListener('scroll',show,{passive:true}); show();
})();
</script>
<script>
// A discreet copy button on every code block (the user's, 2026-09-27): shown
// on hovering the block; copies the block's text; says so for a moment.
// Editors are left alone -- their text is the textarea's.
(function(){
  function add(pre){
    if (pre.dataset.copy || pre.classList.contains('editor-view')) return;
    pre.dataset.copy = '1';
    var b = document.createElement('button');
    b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
    b.title = 'Copy the code'; b.setAttribute('aria-label', 'Copy the code');
    b.addEventListener('click', function(){
      var text = pre.innerText.replace(/Copy(ied)?$/, '').replace(/\n$/, '');
      var done = function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function(){});
    });
    pre.appendChild(b);
  }
  function all(){ document.querySelectorAll('pre.code').forEach(add); }
  all();
  new MutationObserver(all).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
</html>
