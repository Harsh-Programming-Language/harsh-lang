[package]
name = "harsh-site"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Harsh language website, written in Harsh with Dioxus"

# A Harsh project: the sources are `src/**.hrs`, `hrs build` writes the Rust
# to `target/hrs/`, and the target below points at it. `dx` then builds the
# Rust as any Dioxus app. See docs/HANDOVER.md.
[[bin]]
name = "harsh-site"
path = "target/hrs/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
# The highlighter: the books' regular expression, ported (src/highlight.hrs).
regex = "1"
# The transpiler itself, for the Converter page: the library only, no features
# (the driver's remapper and the language server stay out of the wasm).
harsh-lang = { path = "..", default-features = false }

[features]
default = ["web"]
web = ["dioxus/web"]
# Static generation, which the deploy builds (site/DEPLOY.md, part D): the app
# as a Dioxus fullstack app, so `dx bundle --ssg` pre-renders every page. The
# deploy adds the `server` feature the fullstack build needs to its own copy of
# this file, so a plain `dx serve` here keeps building the web app alone.
ssg = ["dioxus/fullstack"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The web build's profile (dx builds the WebAssembly with `wasm-release`,
# inheriting `release`). Not stripped at link time: since LLVM 23 the linker's
# strip removes every custom section, `__wasm_bindgen_unstable` included, and
# wasm-bindgen then fails ("the `__wasm_bindgen_unstable` custom section is
# missing"; the deploy broke on a toolchain update, 2026-10-03). wasm-opt,
# which dx runs after wasm-bindgen, shrinks the file instead.
[profile.wasm-release]
inherits = "release"
strip = false
