# Build the website in site/, every page pre-rendered as HTML (static
# generation), and publish it to GitHub Pages on every push to main. The site is written in Harsh, so the build has one step a Dioxus app
# does not: `hrs`, built from this very checkout, transpiles site/src/**.hrs
# to site/target/src/ before `dx` builds the Rust. The Converter's
# transpiler is the same checkout, as a library.
name: Publish the site

on:
  push:
    branches: [main]
    paths: [site/**, src/**, Cargo.toml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            site

      - name: Install hrs from this checkout
        run: cargo install --path . --locked

      - name: Install the Dioxus CLI
        uses: cargo-bins/cargo-binstall@main
      # The newest 0.7.x, matching the site's `dioxus = "0.7"`: never a newer
      # minor line (0.8 is in alpha as of 2026-09-26), which may not build 0.7.
      - run: cargo binstall --no-confirm dioxus-cli@0.7

      - name: Transpile the Harsh
        # `hrs` transpiles src/**.hrs before running any cargo subcommand;
        # `metadata` is the one that builds nothing.
        working-directory: site
        run: hrs cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Build the site, every page pre-rendered
        # Static generation (the user's decision, 2026-09-27, after trying it
        # on his Mac): Dioxus's fullstack build renders each page to HTML at
        # build time (site/DEPLOY.md, part D). Its server side needs the
        # `server` feature, added here to this job's copy of Cargo.toml only,
        # so `dx serve` on a Mac keeps building the plain web app.
        working-directory: site
        run: |
          sed -i '/^ssg = /a server = ["dioxus/server", "ssg"]' Cargo.toml
          dx bundle --web --ssg --release --features ssg

      - name: Pre-render the pages, if dx did not
        # What `--ssg` does, done by hand when it does not (dx 0.7.10 built
        # both sides and pre-rendered nothing, 2026-09-27): start the site's
        # own server, beside public/, and request every page; its incremental
        # renderer (src/main.hrs) writes each one's HTML into public/.
        working-directory: site
        run: |
          out=$(find target/dx -type d -path '*release/web/public' | head -n 1)
          test -n "$out" || { echo "no release build"; find target/dx -maxdepth 4 -type d; exit 1; }
          if [ -f "$out/learn/index.html" ]; then echo "dx pre-rendered the pages"; exit 0; fi
          dir=$(dirname "$out")
          ls -la "$dir"
          server="$dir/server"
          test -x "$server" || { echo "no server binary in $dir"; exit 1; }
          (cd "$dir" && IP=127.0.0.1 PORT=8080 ./server > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          for page in / /learn /install /converter /playground; do
            curl -sf -o /dev/null "http://127.0.0.1:8080$page" && echo "rendered $page" || echo "could not render $page"
          done
          sleep 2
          pkill -f "$server" || true
          tail -20 /tmp/server.log

      - name: Assemble the pages
        working-directory: site
        run: |
          out=$(find target/dx -type d -path '*release/web/public' | head -n 1)
          test -n "$out" && test -f "$out/index.html"
          rm -rf dist && mkdir dist
          cp -r "$out"/. dist/
          # Every page pre-rendered: its content is in its HTML, not only
          # filled in by the browser. Fail here rather than publish shells.
          for page in "" learn install converter playground; do
            f="dist/${page:+$page/}index.html"
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q "Rust without the braces" dist/index.html
          grep -q "The Harsh Book" dist/learn/index.html
          grep -q "rust-analyzer" dist/install/index.html
          # The books and the guide come from public/ (`public_dir`), copied
          # by dx itself; fail here rather than publish dead links.
          test -f dist/book/index.html && test -f dist/by-example/index.html && test -f dist/cheatsheet/index.html && test -f dist/glance/index.html && test -f dist/patterns/index.html && test -f dist/nomicon/index.html && test -f dist/guide/index.html
          # An unknown path: the app loads and its router shows the
          # not-found page.
          # (The documents -- books, guide, cheat sheet, glance -- are the
          # renderer's, checked by check.sh; a `data:` URL is an inline image,
          # not a link: 2026-10-03, the cheat sheet's logo failed the deploy.)
          # Every internal link on the app's pre-rendered pages leads to a
          # file that is published (2026-09-28: the Learn cards pointed at
          # /learn/book/ -- the books were there, the links were not).
          for f in $(find dist -name index.html -not -path 'dist/book/*' -not -path 'dist/by-example/*' -not -path 'dist/patterns/*' -not -path 'dist/nomicon/*' -not -path 'dist/guide/*' -not -path 'dist/cheatsheet/*' -not -path 'dist/glance/*'); do
            for h in $(grep -o 'href="[^"#]*"' "$f" | sed 's/^href="//; s/"$//' | grep -v '^http\|^mailto:\|^data:' | sort -u); do
              case "$h" in
                /*) p="dist$h" ;;
                *) echo "relative link $h in $f"; exit 1 ;;
              esac
              [ -f "$p" ] || [ -f "$p/index.html" ] || [ -f "${p%/}/index.html" ] || { echo "broken link $h in $f"; exit 1; }
            done
          done
          echo "every internal link arrives"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          ls dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
