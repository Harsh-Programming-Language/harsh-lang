[application]
name = "harsh-site"
# Copied as is into the output, by `dx serve` and `dx build` alike: the
# Book, By Example and the guide, which the Learn page links to.
public_dir = "public"

[web.app]
title = "Harsh — Rust without the braces"
# The site is served from https://harsh-programming-language.github.io/harsh-lang/ ; with a
# custom domain (or a repository named Harsh-Programming-Language.github.io) remove this line.
base_path = "harsh-lang"

[web.watcher]
watch_path = ["src", "assets"]
