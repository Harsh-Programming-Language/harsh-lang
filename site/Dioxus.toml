[application]
name = "harsh-site"
# Copied as is into the output, by `dx serve` and `dx build` alike: the
# Book, By Example and the guide, which the Learn page links to.
public_dir = "public"

[web.app]
title = "Harsh — Rust without the braces"
# Served at the root of https://harsh-lang.com/ (GitHub Pages, with the domain
# attached), so no base_path: `dx serve` serves at http://127.0.0.1:8080/ too.
# At a github.io project address, the site would need base_path = "harsh-lang".

[web.watcher]
watch_path = ["src", "assets"]
