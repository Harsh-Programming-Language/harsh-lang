<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Harsh Language Guide</title>
<style>
:root{
  --bg:#0e1418; --panel:#141c21; --line:#233039;
  --fg:#d7e1e8; --dim:#7d919e; --faint:#5b6d79;
  --rust:#e08b5a; --acc:#6fb3d2; --kw:#c99bdd; --str:#8fbf7f; --num:#e0c07a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,
       "Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
header{padding:64px 0 40px;border-bottom:1px solid var(--line);margin-bottom:40px}
.logo{
  font-family:"SF Mono",SFMono-Regular,ui-monospace,"JetBrains Mono",
              "Cascadia Code",Menlo,Consolas,monospace;
  font-size:clamp(38px,7vw,68px); font-weight:600; letter-spacing:-.02em;
  line-height:1; margin:0; user-select:all;
}
.lg-b{color:var(--faint)}
.lg-n{color:var(--fg)}
.lg-a{color:var(--acc)}
.lg-r{color:var(--rust)}
.lg-i{display:inline-block;transform:skewX(-11deg);transform-origin:50% 70%}
.title{margin:22px 0 6px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.tag{margin:0;color:var(--dim);font-size:16px}
.tag em{color:var(--rust);font-style:normal}
.cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:56px;
      align-items:start;padding-bottom:120px}
body.nav-hidden .cols{grid-template-columns:minmax(0,1fr)}
body.nav-hidden .toc{display:none}
.toggle{
  position:fixed;left:10px;top:10px;z-index:10;
  background:transparent;color:var(--faint);border:0;
  padding:4px 6px;font:12px/1 inherit;cursor:pointer;opacity:.5;
}
.toggle:hover{opacity:1;color:var(--dim)}
.toc{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;
     font-size:14px;border-left:1px solid var(--line);padding-left:18px}
.toc-h{margin:0 0 10px;color:var(--dim);text-transform:uppercase;
       letter-spacing:.09em;font-size:11px}
.toc ul{list-style:none;margin:0;padding:0}
.toc li{margin:.22em 0}
.toc a{color:var(--fg);text-decoration:none;display:block;padding:1px 0}
.toc a:hover{color:var(--acc)}
.toc .l3{padding-left:14px;font-size:13.5px;color:#c5d2db}
.toc .l3 a{color:#c5d2db}
.toc .l4{padding-left:28px;font-size:13px}
.toc .l4 a{color:var(--dim)}
main{min-width:0}
h2{font-size:25px;margin:52px 0 14px;padding-top:8px;letter-spacing:-.01em;
   border-top:1px solid var(--line)}
h2:first-child{border-top:0;margin-top:0}
h3{font-size:18.5px;margin:32px 0 10px;color:#eaf1f6}
h4{font-size:15.5px;margin:24px 0 8px;color:var(--dim);
   text-transform:uppercase;letter-spacing:.06em}
p{margin:.75em 0}
ul,ol{padding-left:22px}
li{margin:.3em 0}
li>ul,li>ol{margin:.3em 0}
strong{color:#fff;font-weight:600}
a{color:var(--acc)}
code{
  font-family:"SF Mono",SFMono-Regular,ui-monospace,"JetBrains Mono",
              "Cascadia Code",Menlo,Consolas,monospace;
  font-size:.9em; background:#1b252b; border:1px solid var(--line);
  padding:.08em .34em; border-radius:4px; color:#cfe0ea;
}
pre.code{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:14px 16px; overflow:auto; margin:14px 0; line-height:1.55;
}
pre.code code{background:none;border:0;padding:0;font-size:13.5px;color:var(--fg)}
pre.code.rust{border-left:3px solid var(--rust)}
pre.code.harsh{border-left:3px solid var(--acc)}
pre.code.diagram{border-left:3px solid var(--faint);color:var(--dim)}
.k{color:var(--kw)} .t{color:var(--acc)} .str{color:var(--str)}
.num{color:var(--num)} .com{color:var(--faint);font-style:italic}
.op{color:var(--rust);font-weight:600} .mac{color:var(--num)}
.defer{color:var(--rust);font-weight:600} .attr{color:var(--faint)}
.p{color:var(--dim)} .blk{color:var(--rust)}
table{border-collapse:collapse;margin:16px 0;font-size:14.5px;width:100%}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;
      vertical-align:top}
th{background:#18222a;color:#eaf1f6;font-weight:600}
td code{font-size:.88em}
blockquote{border-left:3px solid var(--line);margin:1em 0;padding:.1em 1em;
           color:var(--dim)}
footer{border-top:1px solid var(--line);padding:26px 0 60px;color:var(--faint);
       font-size:13.5px}
@media(max-width:900px){
  .cols,body.nav-hidden .cols{grid-template-columns:1fr;gap:0}
  .toc{position:static;max-height:none;border-left:0;border-bottom:1px solid
       var(--line);padding:0 0 20px;margin-bottom:28px}
}
</style>
</head>
<body>
